name: Deploy to GitHub Pages

# Publishes the site whenever main is updated. The repository has no build
# step — the HTML, CSS, and JS are uploaded exactly as they sit in the repo.

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Read the repo, mint the Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the in-flight deploy finish rather than
# cancelling it — a half-applied deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # "." means the repository root, which is where index.html lives.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
